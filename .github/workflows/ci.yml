name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Uploads mobile JS source maps to Sentry so crash stack traces resolve
      # to real source instead of minified/hermes-compiled JS. Inert on this
      # repo today: no real Sentry project exists yet (see the `@sentry/react-native`
      # entry in apps/mobile/app.json and apps/mobile/src/lib/sentry.ts for the
      # matching placeholder-DSN guard), so SENTRY_AUTH_TOKEN is never set and
      # this step is skipped rather than failing the build. Once a human sets
      # up the real Sentry project, add SENTRY_AUTH_TOKEN (and SENTRY_ORG /
      # SENTRY_PROJECT) as repo secrets and this starts running for real.
      #
      # The secrets context can't be referenced directly in an `if:` -
      # GitHub Actions rejects the whole workflow file for that before any
      # job runs, which is what was actually failing every run here. Route
      # it through a step output instead.
      - name: Check for Sentry credentials
        id: sentry_credentials
        if: ${{ github.event_name == 'push' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Sentry source maps (mobile)
        if: ${{ steps.sentry_credentials.outputs.present == 'true' }}
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx expo export --source-maps
          npx sentry-expo-upload-sourcemaps dist
